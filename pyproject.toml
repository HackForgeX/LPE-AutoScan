[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lpe-autoscan"
version = "1.0.0"
description = "Defensive Linux Privilege Escalation Detection & Assessment Toolkit"
readme = "README.md"
requires-python = ">=3.8"
dependencies = []

[project.scripts]
lpe-autoscan = "lpe_autoscan.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
